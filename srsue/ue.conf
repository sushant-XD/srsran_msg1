[rf]
freq_offset = 0
tx_gain = 82
rx_gain = 40
srate = 23.04e6
nof_antennas = 1

device_name = uhd
device_args = type=b200,clock=internal
time_adv_nsamples = 300

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = debug
phy_lib_level = debug
phy_level = debug
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456789
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
#netns = ue1 #docker network isolates already. 
ip_devname = tun_rtue
ip_netmask = 255.255.255.0

[gui]
enable = false

[msg1]
# whether to enable msg1 attack or not
enabled = true
# how many distinct preambles to generate and send at a time (range 1-64), more preambles means less power for each one
# capped to 32
num_of_preambles = 2
# upper bound of preamble index to use (0-63)
max_preamble_index = 31
# linear power multiplier applied to generated preamble
preamble_power = 3
# number of attempts/occasion between each power ramp increment (power is ramped up every x times)
ramping_step = 2
# dB increment applied at each ramp step
ramping_db = 2
# upper bound on ramp-up in dB so that power doesn't grow unbounded
max_ramping_db = 8
